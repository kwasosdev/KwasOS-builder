# KwasOS Live GRUB config
set default=0
set timeout=10

# FIX: rdinit=/init нужен только там, где реально помогает при отладке;
#      вынесен из обычных меню, чтобы не путать.
# FIX: для NVIDIA добавлен второй параметр nouveau.gsp_rm=1 (новые ядра).

menuentry "KwasOS 1.0 Live" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd \
        root=/dev/ram0 ro quiet loglevel=3 \
        console=tty0 \
        rdinit=/init
    initrd /boot/initrd.img-6.18.10
}

menuentry "KwasOS 1.0 Live (safe mode)" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd \
        root=/dev/ram0 ro quiet loglevel=3 \
        nomodeset \
        console=tty0 \
        rdinit=/init
    initrd /boot/initrd.img-6.18.10
}

menuentry "KwasOS 1.0 Live (NVIDIA RTX 40+)" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd \
        root=/dev/ram0 ro quiet loglevel=3 \
        console=tty0 \
        nouveau.config=NvGspRm=1 \
        rdinit=/init
    initrd /boot/initrd.img-6.18.10
}

menuentry "KwasOS 1.0 Live (debug)" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd \
        root=/dev/ram0 ro ignore_loglevel debug \
        console=tty0 console=ttyS0,115200 \
        rdinit=/init
    initrd /boot/initrd.img-6.18.10
}