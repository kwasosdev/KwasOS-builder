set default=0
set timeout=10

menuentry "KwasOS 1.0 Live" {
    linux /boot/vmlinuz-6.18.10-kwasos-1.0 root=/dev/ram0 ro quiet loglevel=3 console=tty0 nouveau.config=NvGspRm=1 rdinit=/init
    initrd /boot/initrd.img-6.18.10
}

menuentry "KwasOS 1.0 Live (safe mode)" {
    linux /boot/vmlinuz-6.18.10-kwasos-1.0 root=/dev/ram0 ro quiet loglevel=3 nomodeset console=tty0 rdinit=/init
    initrd /boot/initrd.img-6.18.10
}

menuentry "KwasOS 1.0 Live (debug)" {
    linux /boot/vmlinuz-6.18.10-kwasos-1.0 root=/dev/ram0 ro ignore_loglevel debug console=tty0 console=ttyS0,115200 rdinit=/init
    initrd /boot/initrd.img-6.18.10
}