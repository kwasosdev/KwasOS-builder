name: KwasOS builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bison gawk texinfo python3 \
            wget xz-utils squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin mtools cpio busybox-static

      - name: Run build
        run: |
          sudo make all

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwasos-iso
          path: build/kwasos-*.iso
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/kwasos-*.iso
            build/kwasos-*.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}